# Usage:  mkdir -p data && sudo chown 10001:10001 data && docker compose up -d --build
# Logs:   docker compose logs -f
services:
  pystemon:
    # Builds the image on your own machine from this folder (no account or download needed).
    build: .
    image: pystemon:local
    # To use the ready-made image from GitHub instead, delete the two lines above and use:
    # image: ghcr.io/hyber-code/pystemon:latest
    # (the package must be made public on GitHub first)
    container_name: pystemon
    restart: unless-stopped
    volumes:
      - ./docker/pystemon.yaml:/opt/pystemon/pystemon.yaml:ro
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
